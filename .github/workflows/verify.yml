name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: Agg
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install matching CPU Torch and project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.0.0' torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[dev]' build
          python - <<'PY'
          import torch
          import torchaudio
          assert torch.version.cuda is None, torch.__version__
          assert torchaudio.__version__.endswith('+cpu'), torchaudio.__version__
          assert torch.__version__.split('+')[0] == torchaudio.__version__.split('+')[0]
          print('CPU builds:', torch.__version__, torchaudio.__version__)
          PY
      - name: Lint delivery verification tooling
        run: >-
          ruff check tools tests/conftest.py tests/test_reference_diagnostic.py
          tests/test_analyze.py tests/test_sonify.py tests/test_visualize.py
      - name: Run all offline contracts and golden fixtures
        run: python -m pytest tests/ -v -ra --junitxml=pytest-results.xml
      - name: Build wheel from sdist
        run: python -m build
      - name: Verify the installed wheel outside the checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tools/installed_smoke.py" \
            "$GITHUB_WORKSPACE/tests/fixtures/natten_0_17_5_golden.pt" \
            "$GITHUB_WORKSPACE/tests/fixtures/delivery_baseline.json"
          all-in-one-infer --help
      - name: Capture failure diagnostics
        if: failure()
        run: |
          python -m pip freeze > dependency-versions.txt
          python -m torch.utils.collect_env > torch-environment.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-python-${{ matrix.python-version }}
          path: |
            pytest-results.xml
            dependency-versions.txt
            torch-environment.txt
