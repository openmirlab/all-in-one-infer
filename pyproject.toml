[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "all-in-one-infer"  # PyPI project name (matches repository name)
# Note: Python package name is "allin1_infer" (in src/allin1_infer/)
# This allows: import allin1_infer (Python) while PyPI project is all-in-one-infer
dynamic = ["version"]
description = "All-In-One Music Structure Analyzer with source separation"
readme = "README.md"
requires-python = ">=3.9"  # scipy>=1.13 and madmom-infer require Python>=3.9
license = {text = "MIT"}
# Note: license-files automatically includes LICENSE by default
authors = [
  { name = "Taejun Kim", email = "taejun@kaist.ac.kr" },
]
maintainers = [
  { name = "Package Maintainers" },
]
keywords = ["music", "beat", "downbeat", "tracking", "structure", "analysis", "allin1-infer", "source-separation"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies
# Note: natten is NOT required anymore — neighborhood attention ships as a
# pure-PyTorch implementation (src/allin1_infer/models/neighborhood_attention.py),
# so no compiled extension and no torch upper bound. If a compatible natten
# (0.17.x-0.19.x) is installed, it is picked up automatically as a faster GPU
# backend; see the [natten] extra below.
dependencies = [
  "numpy",
  "librosa",
  "torch>=2.0.0",
  "hydra-core",
  "omegaconf",
  "huggingface_hub",
  "matplotlib",
  "scipy>=1.0.0",  # scipy 1.13+ requires Python 3.9+; kept as our floor for
                   # numerical parity with the original madmom's own scipy>=1.13
                   # requirement (madmom_infer itself pins no scipy floor)
  # As of 3.1.0, madmom is replaced by madmom-infer -- a plain PyPI dependency,
  # no post-install hook or git source needed. See README.md for details.
  "madmom-infer @ git+https://github.com/openmirlab/madmom-infer.git@a9ed04ec942dd6ec5309df7ce7f3783d1bb42575",
  # Source separation. Pinned at ffe0080, which removed demucs-infer's
  # torchaudio dependency, so torchaudio is no longer installed
  # transitively. This package never imports torchaudio either (issue #7):
  # stems.py decodes wav/flac via soundfile and other formats via
  # demucs-infer's ffmpeg-backed AudioFile.
  "demucs-infer @ git+https://github.com/openmirlab/demucs-infer.git@ffe0080ef96336a34e3f0ee8ba22ceaa0623a36c",
  # soundfile: wav/flac path for stems.py's own input-audio load (see
  # stems.py's _LOSSLESS_SOUNDFILE_EXTS). Already pulled in transitively via
  # demucs-infer, declared explicitly here
  # too since this package imports it directly (article 3: no undeclared
  # transitive assumption).
  "soundfile>=0.12.1",
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
# Optional fused GPU kernels for neighborhood attention. Requires a C++
# toolchain and torch<2.8 at install time (natten 0.17.x compiles against the
# installed torch). Purely a speed optimization — results are identical to the
# built-in pure-PyTorch implementation.
natten = [
  "natten>=0.17.1,<0.20",  # natten>=0.20 removed the legacy functional API and RPB support
  "torch>=2.0.0,<2.8.0",   # natten 0.17.x breaks on torch 2.8+ (_device_t removed)
]
# Development dependencies
dev = [
  "pytest>=8.0",
  "black",
  "ruff",
]

[project.scripts]
all-in-one-infer = "allin1_infer.cli:main"

[project.urls]
Homepage = "https://github.com/openmirlab/all-in-one-infer"
Repository = "https://github.com/openmirlab/all-in-one-infer"
Documentation = "https://github.com/openmirlab/all-in-one-infer#readme"
"Bug Reports" = "https://github.com/openmirlab/all-in-one-infer/issues"
"Original All-In-One" = "https://github.com/mir-aidj/all-in-one"
Changelog = "https://github.com/openmirlab/all-in-one-infer/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/allin1_infer/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/allin1_infer"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/allin1_infer",
  "/tests",
  "/tools",
  "/README.md",
  "/CLAUDE.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.uv]
override-dependencies = [
  "scipy>=1.13.0",  # historical floor from the original madmom's own scipy>=1.13
                     # requirement; kept for numerical parity, not enforced by
                     # madmom_infer itself
]

[tool.hatch.metadata]
allow-direct-references = true
